name: Container
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.51.0
    permissions:
      contents: read
      issues: write   # the alert job files a failed schedule as an issue
      pull-requests: read
    with:
      image: quay.io/crunchtools/memory
      # The image's default CMD serves SSE on 0.0.0.0, which the server refuses
      # without MCP_API_KEY and which the mcp-http profile cannot speak. Boot it
      # over stdio (no transport flag) and require initialize + tools/list.
      boot: mcp
      boot-cmd: "--storage-backend sqlite_vec"
      boot-timeout: 240
      # The house quadlets mount /tmp as a 256m tmpfs; boot under the same (#43).
      boot-run-args: "--tmpfs /tmp:rw,nosuid,size=256m"
      # ...and the HTTP API, under that tmpfs, must answer /api/health.
      contract-test: tests/container/tmpfs_health.sh
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
