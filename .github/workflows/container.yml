name: Container
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.41.0
    permissions:
      contents: read
      pull-requests: read
    with:
      image: quay.io/crunchtools/memory
      # The image's default CMD serves SSE on 0.0.0.0, which the server refuses
      # without MCP_API_KEY and which the mcp-http profile cannot speak. Boot it
      # over stdio (no transport flag) and require initialize + tools/list.
      boot: mcp
      boot-cmd: "--storage-backend sqlite_vec"
      boot-timeout: 240
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
