[tool.sdlc]
repo-kinds = ["forked-mcp-server"]
# This file exists for ruff and for sdlc, not for a package: the image is
# built from upstream's source, and tests/container/*.py are scripts, linted
# by the ruff-check hook. Without this, a pyproject.toml makes sdlc run the
# python stack instead of the container one.
skip-stacks = ["python"]

[tool.sdlc.image]
image = "quay.io/crunchtools/memory"
boot = "mcp"
boot-cmd = "--storage-backend sqlite_vec"
boot-timeout = 240
boot-run-args = "--tmpfs /tmp:rw,nosuid,size=256m"

[tool.sdlc.ci]
checks = ["contract"]

# The contract test, run inside the image this run built: the HTTP API answers
# with /tmp a tmpfs, and a store and a semantic search work, so the embedding
# model loads (#43). The model is baked into the image (#52), so the check runs
# with no network, and MCP_MEMORY_ONNX_ALLOW_DOWNLOAD=0 makes a missing model a
# plain error rather than a fetch. sdlc's image job does not run contract-test
# (crunchtools/sdlc#118), so it is a check that does.
[tool.sdlc.ci.contract]
kind = "command"
image = "localhost/memory:sdlc"
argv = ["python3.14", "-I", "tests/container/tmpfs_health.py"]
env = { HOME = "/app/state", PYTHONPYCACHEPREFIX = "/app/state/pycache", MCP_MEMORY_ONNX_ALLOW_DOWNLOAD = "0" }

[tool.ruff]
line-length = 100
# The Python the sdlc image runs tests/container/*.py with, and the ruff
# hook's rev matches the version that image bakes.
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "C4", "C901", "DTZ", "PIE", "PT",
          "RET", "SIM", "TID", "ARG", "PLC", "PLE", "PLR", "PLW", "TRY", "RUF"]

# Gourmand's IF001 requires explicit thresholds, matched to the fleet's.
[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10
